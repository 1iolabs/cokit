[package]
name = "co-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"
homepage = "https://www.cokit.org"
repository = "https://github.com/1iolabs/cokit.git"
documentation = "https://www.cokit.org/docs/"
description = "Open-source local-first, peer-to-peer collaboration SDK from 1io."

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
cid = { workspace = true }
co-actor = { workspace = true }
co-core-board = { workspace = true }
co-core-co = { workspace = true }
co-core-file = { workspace = true }
co-core-keystore = { workspace = true }
co-core-membership = { workspace = true }
co-core-names = { workspace = true }
co-core-rich-text = { workspace = true }
co-core-room = { workspace = true }
co-core-storage = { workspace = true }
co-guard = { workspace = true, optional = true }
co-identity = { workspace = true }
co-log = { workspace = true }
co-network = { workspace = true, optional = true }
co-primitives = { workspace = true }
co-runtime = { workspace = true }
co-storage = { workspace = true, features = ["overlay"] }
derive_more = { workspace = true }
directories = "5.0.1"
either = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
hmac = "0.12.1"
indexmap = "2.9.0"
ipld-core = { workspace = true }
js-sys = { workspace = true, optional = true }
keyring = { version = "2.3.2", optional = true }
libc = "0.2"
multibase = { workspace = true }
names = "0.14.0"
nix = { version = "0.29.0", optional = true, features = ["fs"] }
notify = { version = "7.0.0", optional = true, features = ["macos_kqueue"] }
pin-project = { workspace = true }
scopeguard = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
sha2 = "0.10.8"
static_assertions = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "io-util"] }
tokio-stream = { workspace = true, default-features = false, features = ["sync"] }
tokio-util = { workspace = true }
tokio_with_wasm = { workspace = true, optional = true, features = ["sync"] }
futures-timer = { version = "3", optional = true }
web-time = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["BroadcastChannel", "DomException", "DomStringList", "Event", "EventTarget", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "MessageEvent", "Window"] }
zstd = { workspace = true, optional = true }

[dev-dependencies]
co-test = { workspace = true }
co-tracing = { workspace = true, features = ["subscriber", "bunyan"] }
criterion = { version = "0.5", features = ["async_tokio"] }
example-counter = { path = "../examples/counter" }
example-counter-upgraded = { path = "../examples/counter-upgraded" }
tokio = { workspace = true, features = ["full", "tracing"] }

[features]
"default" = ["recommended", "co-runtime/cranelift"]

# Meta: Recommended platform neutral features
"recommended" = ["pinning", "native", "network"]

# Enable guard system.
"guard" = ["dep:co-guard"]

# Meta: Enable to run in a apple sandbox.
"apple-sandbox" = ["co-runtime/apple-sandbox"]

# Enable pinning (co-core-storage) feature.
"pinning" = []

# Enable very verbose logging which may has security implications. Only use in development.
"logging-verbose" = ["co-storage/logging-verbose"]

# Bundle WASM binaries instead of native for build-in cores.
# Note: Assumes cores are pre-built and compressed using zst.
"bundle-wasm-cores" = ["dep:zstd"]

# Enable filesystem access
"fs" = ["co-storage/fs", "co-runtime/fs", "dep:notify", "dep:nix"]

# Enable keychain access
"keychain" = ["dep:keyring"]

# Enable libp2p networking
"network" = ["dep:co-network"]

# Enable JS features
"js" = ["dep:wasm-bindgen-futures", "dep:tokio_with_wasm", "dep:js-sys", "dep:futures-timer", "dep:web-time", "uuid/js", "co-runtime/js", "co-actor/js", "co-storage/js"]

# Native Target
"native" = ["co-runtime/native", "co-storage/native", "co-network?/native", "fs", "tokio/full", "keychain"]

# IndexedDB persistent locals (WASM only)
"indexeddb" = ["js", "co-storage/indexeddb", "dep:web-sys", "dep:wasm-bindgen"]

# Web Target (WASM)
"web" = ["js", "co-identity/web", "co-storage/web", "co-runtime/web", "co-network?/web"]

[[bench]]
name = "local_push"
harness = false

[[bench]]
name = "shared_push"
harness = false

[[bench]]
name = "transaction_push"
harness = false
