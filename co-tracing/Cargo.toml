[package]
name = "co-tracing"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"
homepage = "https://www.cokit.org"
repository = "https://github.com/1iolabs/cokit.git"
documentation = "https://www.cokit.org/docs/"
description = "COKIT logging/tracing setup (stderr, file, OpenTelemetry, browser console)."

[lib]
crate-type = ["lib"]

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
tracing-log = { workspace = true, optional = true }
tracing-bunyan-formatter = { workspace = true, optional = true }
clap = { version = "^4.3.23", features = ["derive", "env"], optional = true }

# opentelemetry (native)
opentelemetry = { version = "0.22", optional = true }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.15.0", features = ["tonic"], optional = true }
opentelemetry-semantic-conventions = { version = "0.14.0", optional = true }
opentelemetry-stdout = { version = "0.3.0", features = ["trace"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web = { workspace = true, optional = true }

[features]
default = ["subscriber", "bunyan"]
subscriber = ["dep:tracing-subscriber", "dep:tracing-log"]
bunyan = ["subscriber", "dep:tracing-bunyan-formatter"]
opentelemetry = ["subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions", "dep:opentelemetry-stdout", "dep:tracing-opentelemetry"]
console = ["subscriber", "dep:tracing-web"]
clap = ["dep:clap"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
